<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Internal</title>
    <!-- Memanggil library Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex; /* Membagi layar menjadi kolom */
            min-height: 100vh;
        }

        /* 1. Desain Sidebar Kiri */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar h2 {
            margin-top: 0;
            padding-bottom: 20px;
            border-bottom: 1px solid #34495e;
            text-align: center;
        }

        .welcome-text {
            color: #1abc9c;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Tombol di dalam Sidebar */
        .sidebar button {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #ecf0f1;
            border: none;
            border-radius: 5px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .sidebar button:hover {
            background-color: #34495e;
            padding-left: 20px; /* Efek geser saat disorot */
        }
        
        .btn-logout { background-color: #e74c3c !important; color: white !important; margin-top: 20px; text-align: center !important; }
        .btn-logout:hover { background-color: #c0392b !important; padding-left: 15px !important; }
        
        .btn-primary { background-color: #4285F4 !important; text-align: center !important;}
        .btn-primary:hover { background-color: #357ae8 !important; padding-left: 15px !important; }

        /* 2. Desain Area Konten Kanan */
        .main-content {
            flex: 1; /* Mengambil sisa ruang layar */
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Menengahkan form */
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Container khusus dashboard (lebih lebar) */
        .dashboard-container {
            max-width: 800px;
            text-align: left;
        }

        .hidden { display: none !important; }

        /* Gaya Form */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <!-- SIDEBAR KIRI -->
    <div class="sidebar">
        <h2>Sistem Internal</h2>
        
        <!-- Menu Guest (Belum Login) -->
        <div id="guestMenu">
            <button id="showLoginBtn">Form Login</button>
            <button id="showRegisterBtn" class="btn-primary">Register Akun Baru</button>
        </div>

        <!-- Menu Internal (Sudah Login) -->
        <div id="loggedInMenu" class="hidden">
            <div class="welcome-text">Welcome, <span id="userNameDisplay"></span> !</div>
            
            <button class="menu-btn">Menu 1</button>
            <button class="menu-btn">Menu 2</button>
            <button class="menu-btn">Menu 3</button>
            <button class="menu-btn">Menu 4</button>
            <button class="menu-btn">Menu 5</button>
            
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </div>

    <!-- AREA KONTEN KANAN -->
    <div class="main-content">
        
        <!-- Halaman Sambutan Awal -->
        <div id="welcomeSection" class="container text-center">
            <h3 style="text-align: center;">Selamat Datang</h3>
            <p style="text-align: center;">Silakan klik tombol di menu sebelah kiri untuk masuk ke dalam sistem perusahaan.</p>
        </div>

        <!-- Halaman Dashboard (Berubah saat menu 1-5 diklik) -->
        <div id="dashboardSection" class="container dashboard-container hidden">
            <h3 id="dashboardTitle">Dashboard Utama</h3>
            <p id="dashboardContent">Anda telah berhasil masuk ke dalam sistem. Silakan pilih menu di sebelah kiri untuk mengelola data.</p>
        </div>

        <!-- Form Register -->
        <div id="registerSection" class="container hidden">
            <h3 style="text-align: center;">Pendaftaran Akun</h3>
            <input type="text" id="regName" placeholder="Nama Lengkap" required>
            <input type="text" id="regUsername" placeholder="Username" required>
            <input type="email" id="regEmail" placeholder="Alamat Email" required>
            <input type="password" id="regPassword" placeholder="Password (Min. 8 karakter)" required>
            <button id="doRegisterBtn" class="btn-submit">Daftar Sekarang</button>
        </div>

        <!-- Form Login -->
        <div id="loginSection" class="container hidden">
            <h3 style="text-align: center;">Login Sistem</h3>
            <input type="text" id="loginId" placeholder="Email (Wajib gunakan Email)" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button id="doLoginBtn" class="btn-submit">Masuk</button>
        </div>

    </div>

    <script>
        // 1. Inisialisasi Koneksi ke Appwrite
        const { Client, Account, ID } = Appwrite;
        const client = new Client()
            .setEndpoint('https://sgp.cloud.appwrite.io/v1')
            .setProject('6aea915d0004c5f2b544');

        const account = new Account(client);

        // 2. Deklarasi Elemen-elemen HTML
        const welcomeSec = document.getElementById('welcomeSection');
        const loginSec = document.getElementById('loginSection');
        const registerSec = document.getElementById('registerSection');
        const dashboardSec = document.getElementById('dashboardSection');
        
        const guestMenu = document.getElementById('guestMenu');
        const loggedInMenu = document.getElementById('loggedInMenu');
        const userNameDisplay = document.getElementById('userNameDisplay');

        // 3. Cek Status Login
        account.get()
            .then(function (user) {
                // JIKA SUDAH LOGIN
                guestMenu.classList.add('hidden');
                loggedInMenu.classList.remove('hidden');
                
                welcomeSec.classList.add('hidden');
                loginSec.classList.add('hidden');
                registerSec.classList.add('hidden');
                dashboardSec.classList.remove('hidden');

                const fullName = user.name;
                const justName = fullName.split(' (')[0]; 
                userNameDisplay.textContent = justName;
            })
            .catch(function (error) {
                // JIKA BELUM LOGIN
                // Biarkan tampilan menu guest
            });

        // 4. Logika Tampilkan Form (Guest)
        document.getElementById('showLoginBtn').addEventListener('click', () => {
            welcomeSec.classList.add('hidden'); 
            registerSec.classList.add('hidden'); 
            loginSec.classList.remove('hidden');
        });

        document.getElementById('showRegisterBtn').addEventListener('click', () => {
            welcomeSec.classList.add('hidden'); 
            loginSec.classList.add('hidden'); 
            registerSec.classList.remove('hidden');
        });

        // 5. Logika Menu 1 sampai 5
        const menuBtns = document.querySelectorAll('.menu-btn');
        const dashboardTitle = document.getElementById('dashboardTitle');
        const dashboardContent = document.getElementById('dashboardContent');

        menuBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const menuName = e.target.textContent;
                dashboardTitle.textContent = "Halaman " + menuName;
                dashboardContent.textContent = "Ini adalah area untuk " + menuName + ". Nantinya Anda bisa meletakkan form, tabel database, atau grafik di sini.";
            });
        });

        // 6. Logika Proses Register
        document.getElementById('doRegisterBtn').addEventListener('click', () => {
            const name = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if (password.length < 8) {
                alert('Password harus minimal 8 karakter!');
                return;
            }

            const combinedName = `${name} (${username})`;

            account.create(ID.unique(), email, password, combinedName)
                .then(() => {
                    alert('Registrasi berhasil! Silakan login menggunakan Email dan Password Anda.');
                    document.getElementById('showLoginBtn').click();
                })
                .catch(error => {
                    alert('Registrasi gagal: ' + error.message);
                });
        });

        // 7. Logika Proses Login
        document.getElementById('doLoginBtn').addEventListener('click', () => {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('loginPassword').value;

            if (!loginId.includes('@')) {
                alert('Sistem saat ini mewajibkan penggunaan Email untuk Login. Silakan masukkan alamat Email Anda.');
                return;
            }

            account.createEmailPasswordSession(loginId, password)
                .then(() => {
                    window.location.reload();
                })
                .catch(error => {
                    alert('Login gagal. Cek kembali Email dan Password Anda.');
                });
        });

        // 8. Logika Proses Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            account.deleteSession('current')
                .then(() => {
                    window.location.reload();
                });
        });
    </script>
</body>
</html>
