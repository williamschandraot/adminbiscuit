<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Internal</title>
    <!-- Memanggil library Appwrite -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex; /* Membagi layar menjadi kolom */
            min-height: 100vh;
        }

        /* 1. Desain Sidebar Kiri */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar h2 {
            margin-top: 0;
            padding-bottom: 20px;
            border-bottom: 1px solid #34495e;
            text-align: center;
        }

        .welcome-text {
            color: #1abc9c;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Tombol di dalam Sidebar */
        .sidebar button {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #ecf0f1;
            border: none;
            border-radius: 5px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .sidebar button:hover {
            background-color: #34495e;
            padding-left: 20px; /* Efek geser saat disorot */
        }
