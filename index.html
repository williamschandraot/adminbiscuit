<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Internal</title>
    <!-- Memanggil library Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* Navigasi Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .navbar h2 { margin: 0; color: #2c3e50; }
        .nav-buttons button {
            margin-left: 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login-nav { background-color: #ecf0f1; color: #2c3e50; }
        .btn-register-nav { background-color: #4285F4; color: white; }
        .btn-logout { background-color: #e74c3c; color: white; }
        .btn-logout:hover { background-color: #c0392b; }

        .welcome-text {
            font-weight: bold;
            color: #2c3e50;
            margin-right: 15px;
        }

        /* Kotak Konten Utama */
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .hidden { display: none !important; }

        /* Gaya Form */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Area Navigasi Atas -->
    <div class="navbar">
        <h2>Sistem Internal</h2>
        
        <!-- Menu untuk user yang BELUM login -->
        <div id="guestMenu" class="nav-buttons">
            <button id="showLoginBtn" class="btn-login-nav">Login</button>
            <button id="showRegisterBtn" class="btn-register-nav">Register</button>
        </div>

        <!-- Menu untuk user yang SUDAH login -->
        <div id="loggedInMenu" class="nav-buttons hidden">
            <span class="welcome-text">Welcome, <span id="userNameDisplay"></span> !</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </div>

    <!-- Halaman Sambutan -->
    <div id="welcomeSection" class="container">
        <h3>Selamat Datang</h3>
        <p>Silakan klik Login atau Register di sudut kanan atas untuk masuk ke sistem.</p>
    </div>

    <!-- Halaman Dashboard (Setelah Login) -->
    <div id="dashboardSection" class="container hidden">
        <h3>Dashboard Internal</h3>
        <p>Anda telah berhasil masuk ke dalam sistem.</p>
    </div>

    <!-- Form Register -->
    <div id="registerSection" class="container hidden">
        <h3>Pendaftaran Akun Baru</h3>
        <input type="text" id="regName" placeholder="Nama Lengkap" required>
        <input type="text" id="regUsername" placeholder="Username" required>
        <input type="email" id="regEmail" placeholder="Alamat Email" required>
        <input type="password" id="regPassword" placeholder="Password (Min. 8 karakter)" required>
        <button id="doRegisterBtn" class="btn-submit">Daftar Sekarang</button>
    </div>

    <!-- Form Login -->
    <div id="loginSection" class="container hidden">
        <h3>Login Sistem</h3>
        <input type="text" id="loginId" placeholder="Email (Wajib Email)" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button id="doLoginBtn" class="btn-submit">Masuk</button>
    </div>

    <script>
        // 1. Inisialisasi Appwrite
        const { Client, Account, ID } = Appwrite;
        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject('ISI_DENGAN_PROJECT_ID_APPWRITE_ANDA'); // Ganti dengan Project ID Anda

        const account = new Account(client);

        // 2. Deklarasi Elemen
        const welcomeSec = document.getElementById('welcomeSection');
        const loginSec = document.getElementById('loginSection');
        const registerSec = document.getElementById('registerSection');
        const dashboardSec = document.getElementById('dashboardSection');
        const guestMenu = document.getElementById('guestMenu');
        const loggedInMenu = document.getElementById('loggedInMenu');
        const userNameDisplay = document.getElementById('userNameDisplay');

        // 3. Cek Status Login Saat Halaman Dimuat
        account.get()
            .then(function (user) {
                // JIKA SUDAH LOGIN:
                guestMenu.classList.add('hidden');
                loggedInMenu.classList.remove('hidden');
                
                // Menyembunyikan form, menampilkan dashboard
                welcomeSec.classList.add('hidden');
                loginSec.classList.add('hidden');
                registerSec.classList.add('hidden');
                dashboardSec.classList.remove('hidden');

                // Mengambil nama depan (karena kita simpan format: Nama (Username))
                const fullName = user.name;
                const justName = fullName.split(' (')[0]; // Memotong bagian username
                userNameDisplay.textContent = justName;
            })
            .catch(function (error) {
                // JIKA BELUM LOGIN: biarkan tampilan default (halaman sambutan)
            });

        // 4. Logika Navigasi (Untuk Guest)
        document.getElementById('showLoginBtn').addEventListener('click', () => {
            welcomeSec.classList.add('hidden'); registerSec.classList.add('hidden'); loginSec.classList.remove('hidden');
        });
        document.getElementById('showRegisterBtn').addEventListener('click', () => {
            welcomeSec.classList.add('hidden'); loginSec.classList.add('hidden'); registerSec.classList.remove('hidden');
        });

        // 5. Logika Register
        document.getElementById('doRegisterBtn').addEventListener('click', () => {
            const name = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if (password.length < 8) {
                alert('Password harus minimal 8 karakter!');
                return;
            }

            const combinedName = `${name} (${username})`;

            account.create(ID.unique(), email, password, combinedName)
                .then(() => {
                    alert('Registrasi berhasil! Silakan login.');
                    document.getElementById('showLoginBtn').click();
                })
                .catch(error => alert('Registrasi gagal: ' + error.message));
        });

        // 6. Logika Login
        document.getElementById('doLoginBtn').addEventListener('click', () => {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('loginPassword').value;

            if (!loginId.includes('@')) {
                alert('Silakan masukkan Email yang terdaftar, bukan Username.');
                return;
            }

            account.createEmailPasswordSession(loginId, password)
                .then(() => {
                    // Jika login berhasil, refresh halaman agar status login terdeteksi di atas
                    window.location.reload();
                })
                .catch(error => alert('Login gagal: ' + error.message));
        });

        // 7. Logika Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            account.deleteSession('current')
                .then(() => {
                    // Refresh halaman setelah logout
                    window.location.reload();
                });
        });
    </script>
</body>
</html>
